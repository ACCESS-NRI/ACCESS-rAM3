# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-ram3]
  - _version: [2025.08.000]
  specs:
  - access-ram3
  packages:
    # Direct dependencies testing
    um:
      require:
      - '@13.5'
      - model="vn13p5-rns"
      - +DR_HOOK
      - +eccodes
    # Indirect dependencies
    eccodes:
      require:
      - '@2.34.0'
      - '+memfs'
    netcdf-c:
      require:
      - '@4.9.2'
    netcdf-fortran:
      require:
      - '@4.5.2'
    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'
    gcom:
      require:
      - '@8.3'
    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    # Specifications that apply to all packages
    all:
      prefer:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
  modules:
    # NOTE: Don't remove! This section is mandatory for the rAM3 suite to work correctly.
    default:
      tcl:
        all:
          environment:
            set:
              'SPACK_{name}_ROOT': '{prefix}'
